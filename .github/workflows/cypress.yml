name: Cypress Tests

on:
  push:
    branches: [main, preprod, senat-premain]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm run build

      - name: Start Next.js server (background)
        run: |
          pnpm run start &
          npx wait-on http://localhost:3000

      - name: Run Cypress tests
        run: pnpm run cypress:run:ci
        env:
          CYPRESS_BASE_URL: http://localhost:3000
          CYPRESS_CI: true

      - name: Upload Cypress screenshots and videos (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots/
            cypress/videos/
          retention-days: 5

      - name: Generate and upload Cypress report (if using mochawesome)
        if: always()
        run: |
          npx mochawesome-merge cypress/reports/*.json > cypress/report.json
          npx mochawesome-report-generator cypress/report.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: cypress/report/
